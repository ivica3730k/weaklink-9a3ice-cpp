# One service per buildable platform. Each mounts the repo and drops its
# binaries in ./binaries/<platform>/ so GitHub Actions can upload them
# straight from there.
#
# macOS has no service: Apple's SDK cannot run in a Linux container. Build it
# natively on a macos-* runner with `make build-mac` / `make build-mac-arm`.

services:
  linux-amd64:
    build:
      context: .
      dockerfile: docker/linux-amd64/Dockerfile
    platform: linux/amd64
    volumes:
      - .:/src
    working_dir: /src
    environment:
      WEAKLINK_PLATFORM: linux-amd64

  linux-arm64:
    build:
      context: .
      dockerfile: docker/linux-arm64/Dockerfile
    platform: linux/arm64
    volumes:
      - .:/src
    working_dir: /src
    environment:
      WEAKLINK_PLATFORM: linux-arm64

  windows-x64:
    build:
      context: .
      dockerfile: docker/windows/Dockerfile
    platform: linux/amd64
    volumes:
      - .:/src
    working_dir: /src
    environment:
      WEAKLINK_PLATFORM: windows-x64
